; The development stack: the API and the built SPA on 2100 (uvicorn with reload),
; the worker (with remote execution enabled, its remote poller thread too) and the Vite dev server on 2101
; (proxying /api to 2100). Use the make targets, which call scripts/stack.sh: make dev-up, dev-status, dev-logs,
; dev-down. Do not start supervisord on it by hand.
;
; stack.sh starts supervisord after sourcing scripts/env.sh and deploy/supervisor/dev.sh, so every program
; inherits that environment: PATH (the env's bin first), PYTHONPATH (this checkout's backend),
; LAUEPORTAL_CONFIG and the stack's overrides. No program starts with supervisord; stack.sh starts them once the
; database exists (it seeds the demo database when there is none).
; Paths: the socket and the pidfile in the workspace's tmp/, the logs in its logs/ (dev-<program>.log).

[unix_http_server]
file = %(ENV_LAUE_DEV_WORKSPACE)s/tmp/supervisor-dev.sock
chmod = 0700

[supervisorctl]
serverurl = unix://%(ENV_LAUE_DEV_WORKSPACE)s/tmp/supervisor-dev.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
pidfile = %(ENV_LAUE_DEV_WORKSPACE)s/tmp/supervisord-dev.pid
logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/supervisord-dev.log
logfile_maxbytes = 5MB
logfile_backups = 2
childlogdir = %(ENV_LAUE_DEV_WORKSPACE)s/logs
directory = %(ENV_REPO_ROOT)s
; Files supervisord and the programs create (the logs among them) are private: 0600, directories 0700.
umask = 077

[program:api]
; uvicorn's reloader and its server process form one process group: stop and kill them together.
command = laueportal serve --reload
directory = %(ENV_REPO_ROOT)s
priority = 20
autostart = false
autorestart = true
startsecs = 3
stopsignal = TERM
stopwaitsecs = 20
stopasgroup = true
killasgroup = true
stdout_logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/dev-api.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true

[program:worker]
; The worker (jobs/worker.py): the job table is the queue. Its dispatcher starts each run or conversion in a job process
; of its own session (python -m laueportal.jobs.process), which killasgroup does not reach: the worker stops them
; itself. The first SIGTERM claims nothing more and asks the job processes to drain (a run ends Failed/interrupted) for
; up to execution.shutdown_grace_seconds (600 s in dev.toml) from the SIGTERM, then kills their groups; a second SIGTERM
; kills them at once. stopwaitsecs covers the grace plus the stop's tail (at most about 46 s): keep it 60 s above the
; setting. A second worker on the same database exits 1 at the worker lock. With remote execution enabled ([remote]
; enabled and settings_file, the private bdp.yaml, in the workspace's config/dev.toml;
; docs/runbooks/remote-execution.md), the worker also runs the remote poller as a thread, under bdp.yaml's
; submission_directory/.poller.lock; it waits while another poller holds that lock.
command = laueportal worker
directory = %(ENV_REPO_ROOT)s
priority = 30
autostart = false
autorestart = true
startsecs = 3
startretries = 10
stopsignal = TERM
stopwaitsecs = 660
killasgroup = true
stdout_logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/dev-worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true

[program:vite]
; pnpm and the vite (node) process it starts form one process group.
command = pnpm -C %(ENV_REPO_ROOT)s/frontend dev
directory = %(ENV_REPO_ROOT)s/frontend
priority = 40
autostart = false
autorestart = true
startsecs = 3
stopsignal = TERM
stopwaitsecs = 10
stopasgroup = true
killasgroup = true
stdout_logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/dev-vite.log
stdout_logfile_maxbytes = 5MB
stdout_logfile_backups = 2
redirect_stderr = true

