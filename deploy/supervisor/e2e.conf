; The e2e stack (make e2e): the dev stack's ports and programs minus Vite, the API without reload serving
; this checkout's frontend/dist, on a database and runs root of its own (deploy/supervisor/e2e.sh) that
; make e2e seeds afresh (`laueportal seed demo --force`) before the API and the worker start. scripts/stack.sh
; starts and stops it; make e2e always stops it. Only one stack runs at a time: it shares 2100 with dev.
;
; stack.sh starts supervisord after sourcing scripts/env.sh and deploy/supervisor/e2e.sh (see dev.conf).
; The socket and the pidfile are in the workspace's tmp/, the logs in its logs/ (e2e-<program>.log).

[unix_http_server]
file = %(ENV_LAUE_DEV_WORKSPACE)s/tmp/supervisor-e2e.sock
chmod = 0700

[supervisorctl]
serverurl = unix://%(ENV_LAUE_DEV_WORKSPACE)s/tmp/supervisor-e2e.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
pidfile = %(ENV_LAUE_DEV_WORKSPACE)s/tmp/supervisord-e2e.pid
logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/supervisord-e2e.log
logfile_maxbytes = 5MB
logfile_backups = 2
childlogdir = %(ENV_LAUE_DEV_WORKSPACE)s/logs
directory = %(ENV_REPO_ROOT)s
; Files supervisord and the programs create (the logs among them) are private: 0600, directories 0700.
umask = 077

[program:api]
command = laueportal serve
directory = %(ENV_REPO_ROOT)s
priority = 20
autostart = false
autorestart = true
startsecs = 3
stopsignal = TERM
stopwaitsecs = 20
stopasgroup = true
killasgroup = true
stdout_logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/e2e-api.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true

[program:worker]
; As in dev.conf (job processes in sessions of their own): stopwaitsecs covers
; execution.shutdown_grace_seconds plus the stop's tail (at most about 46 s).
command = laueportal worker
directory = %(ENV_REPO_ROOT)s
priority = 30
autostart = false
autorestart = true
startsecs = 3
startretries = 10
stopsignal = TERM
stopwaitsecs = 660
killasgroup = true
stdout_logfile = %(ENV_LAUE_DEV_WORKSPACE)s/logs/e2e-worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true
